name: untitled
description: "A new Flutter project."





environment:
  sdk: ^3.5.4

#----------- PACKAGES --------#
dependencies:
  flutter:
    sdk: flutter



  #----------- BACKEND PACKAGES --------#
  firebase_auth: ^6.0.0
  firebase_core: ^4.0.0
  cloud_firestore: ^6.0.0
  firebase_storage: ^13.0.0
  firebase_app_check: ^0.4.0

  #----------- ICONS --------#
  iconsax: ^0.0.8
  cupertino_icons: ^1.0.8




  #----------- UTIL PACKAGES --------#
  http: ^1.3.0
  logger: ^2.5.0
  url_launcher: ^6.3.1
  intl: ^0.20.1
  flutter_native_splash: ^2.4.4
  connectivity_plus: ^7.0.0
  smooth_page_indicator: ^1.2.0+3
  image_cropper: ^11.0.0
  image_picker: ^1.1.2
  gal: ^2.3.0
  csv: ^6.0.0
  file_picker: ^8.1.6
  screenshot: ^3.0.0
  path_provider: ^2.1.5

  #----------- STATE MANAGEMENT --------#
  get_storage: ^2.1.1
  get: ^4.6.6
  flutter_to_pdf: ^0.4.0
  flutter_screenutil: ^5.5.0
  flutter_riverpod: ^2.5.1
  video_player: ^2.10.0
  dio: ^5.9.0





dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/pinesville_logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/pinesville_logo.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^6.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  assets:
  - assets/images/gcash.jpg
  - assets/images/bdo.jpg
  - assets/images/IMG.jpg
  - assets/images/pinesville_logo.png
  - assets/images/ianimate.gif
  - assets/images/processdata.json
  - assets/images/default_profile.png
  - assets/images/icon-gcash.png
  - assets/images/icon-bdo.png
  - assets/images/icon-gotyme.png
  - assets/images/gotyme.JPG


  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Black.ttf
          weight: 900
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400

    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400

