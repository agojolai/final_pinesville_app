<!DOCTYPE html>
<html>
<head>
    <title>Pinesville Onboarding Screenshot</title>
    <style>
        body { 
            margin: 0; 
            padding: 20px; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto;
            background: #f5f5f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .phone {
            width: 375px;
            height: 812px;
            background: white;
            border-radius: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            position: relative;
        }
        .status-bar {
            height: 44px;
            background: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-weight: 600;
        }
        .skip {
            position: absolute;
            top: 60px;
            right: 16px;
            color: #666;
            font-size: 16px;
        }
        .content {
            padding: 100px 32px 32px;
            text-align: center;
            height: calc(100% - 44px);
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .icon {
            width: 120px;
            height: 120px;
            margin: 0 auto 32px;
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-radius: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 60px;
            color: white;
            border: 2px solid rgba(99, 102, 241, 0.3);
        }
        h1 {
            font-size: 28px;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 24px;
            line-height: 1.2;
        }
        p {
            font-size: 16px;
            color: #6b7280;
            line-height: 1.5;
            margin-bottom: 48px;
        }
        .indicators {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 32px;
        }
        .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: rgba(99, 102, 241, 0.3);
        }
        .dot.active {
            width: 24px;
            background: #6366f1;
            border-radius: 4px;
        }
        .button {
            width: 100%;
            background: #6366f1;
            color: white;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }
        .demo-note {
            position: absolute;
            bottom: -60px;
            left: 0;
            right: 0;
            text-align: center;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="phone">
        <div class="status-bar">
            <span>9:41</span>
            <span>100%</span>
        </div>
        
        <div class="skip">Skip</div>
        
        <div class="content">
            <div class="icon">🏠</div>
            <h1>Welcome to Pinesville</h1>
            <p>Your digital home management solution. Manage your residence with ease and stay connected with your community.</p>
            
            <div style="flex: 1;"></div>
            
            <div class="indicators">
                <div class="dot active"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
                <div class="dot"></div>
            </div>
            
            <button class="button">Next →</button>
        </div>
        
        <div class="demo-note">
            Pinesville App - Onboarding Screen (Page 1 of 5)
        </div>
    </div>
</body>
</html>
